    <rect x="70" y="40" width="100" height="24" rx="8" fill="#78716c" opacity="0.35"/>
  </g>
  <!-- plant -->
  <g transform="translate(1120 380)" opacity="0.85">
    <path d="M40 180c40-60 100-100 160-120-60 20-100 80-120 160-20-50-20-100 0-140Z" fill="#86efac" opacity="0.55"/>
    <path d="M60 180c20-70 80-120 150-140-50 40-80 100-90 160Z" fill="#4ade80" opacity="0.4"/>
