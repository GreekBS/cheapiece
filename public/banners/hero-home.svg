<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="700" viewBox="0 0 1920 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hh-bg" x1="0" y1="0" x2="1900" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbeb"/>
      <stop offset="0.35" stop-color="#ffedd5"/>
      <stop offset="0.7" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="hh-warm" x1="1100" y1="40" x2="1880" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hh-cream" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffef9"/>
      <stop offset="1" stop-color="#faf5f0"/>
