  </defs>
  <rect width="1920" height="700" fill="url(#hh-bg)"/>
  <ellipse cx="1500" cy="340" rx="480" ry="300" fill="url(#hh-warm)"/>
  <!-- window / cozy arch -->
  <g transform="translate(1020 100)" opacity="0.95">
    <path d="M0 80c0-88 72-160 160-160h200c88 0 160 72 160 160v360H0V80Z" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" opacity="0.9"/>
