    <line x1="240" y1="120" x2="240" y2="360" stroke="#fed7aa" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="240" x2="420" y2="240" stroke="#fed7aa" stroke-width="1.2" opacity="0.6"/>
  </g>
  <!-- coffee machine -->
  <g transform="translate(1280 220)">
    <rect x="0" y="80" width="160" height="200" rx="20" fill="url(#hh-cream)" stroke="#d6d3d1" stroke-width="1.2"/>
    <rect x="24" y="100" width="112" height="100" rx="8" fill="#e7e5e4"/>
    <rect x="48" y="220" width="64" height="44" rx="6" fill="#44403c" opacity="0.85"/>
    <path d="M56 0h48c8 0 14 6 14 14v66H42V14c0-8 6-14 14-14Z" fill="#fafaf9" stroke="#d6d3d1"/>
    <ellipse cx="80" cy="200" rx="28" ry="8" fill="#f5f5f4"/>
